services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: raglab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: raglab
      POSTGRES_USER: raglab
      POSTGRES_PASSWORD: raglab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raglab -d raglab"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  adminer:
    image: adminer:4
    container_name: raglab-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  neo4j:
    image: neo4j:5.20-community
    container_name: raglab-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/raglab_neo4j
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    container_name: raglab-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 5m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s

  app:
    build: .
    container_name: raglab-app
    working_dir: /workspace
    command: sleep infinity
    volumes:
      - .:/workspace
    environment:
      RAGLAB_DATABASE_URL: postgresql+psycopg://raglab:raglab@postgres:5432/raglab
      RAGLAB_OLLAMA_BASE_URL: http://ollama:11434
      RAGLAB_GENERATION_MODEL: qwen2.5:7b
      RAGLAB_NEO4J_URI: bolt://neo4j:7687
      RAGLAB_NEO4J_USER: neo4j
      RAGLAB_NEO4J_PASSWORD: raglab_neo4j
      PYTHONPATH: /workspace/src
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    profiles:
      - app

  api:
    build: .
    container_name: raglab-api
    working_dir: /workspace
    command: uvicorn raglab.api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/workspace
    ports:
      - "8000:8000"
    environment:
      RAGLAB_DATABASE_URL: postgresql+psycopg://raglab:raglab@postgres:5432/raglab
      RAGLAB_OLLAMA_BASE_URL: http://ollama:11434
      RAGLAB_GENERATION_MODEL: qwen2.5:7b
      # The api image ships CPU-only torch: default re-ranking is skipped
      # there (RAGLAB_RERANK_WITHOUT_GPU=skip) and each response says so;
      # it runs when raglab runs natively with a GPU (see docs/reranking.md).
      RAGLAB_GENERATION_TIMEOUT_SECONDS: "600"
      RAGLAB_ADMINER_URL: http://localhost:8080
      RAGLAB_API_CORS_ORIGINS: '["http://localhost:5173","http://localhost:8081","http://127.0.0.1:5173","http://127.0.0.1:8081"]'
      RAGLAB_NEO4J_URI: bolt://neo4j:7687
      RAGLAB_NEO4J_USER: neo4j
      RAGLAB_NEO4J_PASSWORD: raglab_neo4j
      PYTHONPATH: /workspace/src
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    profiles:
      - app

  frontend:
    build:
      context: ./frontend
    container_name: raglab-frontend
    ports:
      - "8081:80"
    depends_on:
      - api
    profiles:
      - app

volumes:
  postgres_data:
    name: raglab_postgres_data
  ollama_data:
    name: raglab_ollama_data
  neo4j_data:
    name: raglab_neo4j_data
