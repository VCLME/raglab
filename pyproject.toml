[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raglab"
version = "0.1.0"
description = "RAG local orienté expérimentation avec PostgreSQL, pgvector et Ollama."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1.0",
  "pgvector>=0.3.6",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "requests>=2.32.0",
  "sqlalchemy>=2.0.32",
  "torch>=2.5.0",
  "transformers>=4.46.0",
  "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
raglab = "raglab.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
