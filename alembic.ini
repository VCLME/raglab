# Alembic CLI entry point, e.g. `alembic -c alembic.ini revision -m "..."`.
# The database URL comes from RAGLAB_DATABASE_URL (see migrations/env.py);
# `raglab db init` runs the migrations without this file.
[alembic]
script_location = src/raglab/db/migrations
prepend_sys_path = src

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
